# RTX 3090 (24 GB) config: 32 Hz model rate, big batch, 200k Tanh residual.
# Run: python -u main.py config/hybrid_3090.yaml
seed: 0
device: cuda

data:
  target_fs: 64.0
  ode_fs: 32.0
  window_sec: 60.0
  prefix_sec: 20.0
  horizon_sec: 40.0
  n_channels: 22
  state_dim: 5

experiment:
  name: hybrid

model:
  residual_hidden: 256
  residual_layers: 4
  residual_activation: tanh
  residual_skip: true

train:
  batch_size: 8192
  # VRAM micro-batching: effective batch stays 8192 (exact accumulated
  # gradients); peak memory is set by the micro-batch (1024 x 1920 steps).
  micro_batch: 1024
  n_train: 50000
  n_val: 120
  epochs: 50
  lr: 0.0003
  sampler: targeted
  sampler: targeted

state_estimation:
  inner_steps: 3
  lr: 0.02
  ridge: 0.0001
  clamp: 2.5

loss:
  lambda_residual: 0.001
  lambda_lyapunov: 0.0
  lyapunov_margin: 0.0

split:
  train_patients: [chb01, chb02, chb03, chb06, chb07, chb08, chb09, chb10, chb11, chb12, chb13, chb14, chb15, chb16, chb17, chb18, chb20, chb21]
  val_patients: [chb04, chb19, chb23]
  test_patients: [chb05, chb22, chb24]
  quotas:
    interictal: 0.4
    preictal_far: 0.2
    preictal_near: 0.2
    ictal: 0.1
    postictal: 0.1

paths:
  ckpt: artifacts/checkpoints/hybrid_3090.pt
  log: artifacts/metrics/hybrid_3090.log
